[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-stock-trading"
version = "0.1.0"
description = "ai-sdf auto-trading project - Stage 1 (US Stock)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.1",
    "pyarrow",
    "scikit-learn",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "joblib",
    "yfinance",
    "exchange-calendars",
    "fastapi",
    "uvicorn[standard]",
    "alpaca-py",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["data_pipeline", "strategies", "risk_management", "api"]
